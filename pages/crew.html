<div class="crew-page-content">
  <!-- Persistent Header -->
  <header class="crew-header">
    <div class="header-inner">
      <!-- Title Section -->
      <div class="crew-title">
        <div class="title-with-save">
          <div class="title-text">
            <h1 id="tableTitle">Loading Event...</h1>
            <h2>CREW CALL SHEET</h2>
          </div>
          <div class="save-controls">
            <span id="saveStatus" class="save-status">All changes saved</span>
          </div>
        </div>
      </div>
      
      <!-- Compact Filter & Controls Bar -->
      <div class="filter-sort-bar">
        <div class="crew-actions-row">
          <button id="addDateBtn" class="add-date-btn" title="Add a new date">
            <span class="material-symbols-outlined">add</span>
            <span class="btn-label">Add Date</span>
          </button>
          <div class="crew-icon-group" aria-label="Crew actions">
            <div id="crewListBtnContainer"></div>
            <button id="crewCostCalcBtn" class="crew-icon-btn" title="Calculate crew costs">
              <span class="material-symbols-outlined">calculate</span>
              <span class="btn-label">Cost Calculator</span>
            </button>
            <button id="exportCsvBtn" class="crew-icon-btn" title="Export to CSV">
              <span class="material-symbols-outlined">download</span>
              <span class="btn-label">Export CSV</span>
            </button>
          </div>
        </div>
        <div class="crew-filter-row">
          <select id="filterDate" title="Filter by date">
            <option value="">Show All Dates</option>
          </select>
          <input type="text" id="searchInput" placeholder="Search crew..." title="Search by name, role, or notes">
        </div>
      </div>
    </div>
  </header>
  
  <!-- Main Content Area -->
  <main class="crew-main">
    <div id="dateSections"></div>
  </main>
  
  <!-- Modals Container -->
  <div id="crewCostCalcModalContainer"></div>
</div>
