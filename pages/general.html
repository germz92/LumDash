<!-- Google Fonts Roboto -->
<link href="https://fonts.googleapis.com/css?family=Roboto:400,500,700&display=swap" rel="stylesheet">
<!-- Add Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

<div class="general-page">
  <header class="general-page-header">
    <div class="general-page-toolbar">
      <div id="adminNotesBtnContainer"></div>
      <div id="clockIconContainer">
        <button id="clockIconBtn" class="clock-icon-btn general-toolbar-icon-btn" title="Show current time" aria-label="Show current time">
          <span class="material-symbols-outlined">schedule</span>
        </button>
      </div>
    </div>
    <h1 id="eventTitle" class="general-event-title"></h1>
  </header>

  <form id="generalForm" class="general-form" onsubmit="event.preventDefault(); saveGeneralInfo();">
    <section class="general-overview" aria-label="Event overview">
      <div class="info-section">
        <div class="info-card info-card--summary">
          <label for="summary" class="info-card-label info-card-label--toggle" onclick="toggleEventSummary()">
            <span class="info-card-label-text">
              <span class="material-symbols-outlined">description</span>
              Event Summary
            </span>
            <span class="material-symbols-outlined info-card-chevron" id="summaryToggleIcon">expand_more</span>
          </label>
          <div id="summaryContent" class="info-card-body">
            <div id="summary" class="read-only"></div>
            <div id="summaryEditorContainer" class="summary-editor-wrap">
              <button type="button" id="populateCoverageBtn" class="add-row-btn general-btn-outline coverage-populate-btn" onclick="populateCoverageFromCrew()">Auto populate</button>
              <div id="summaryEditor" class="tinymce-editor"></div>
            </div>
            <div class="event-access" id="eventAccess" hidden>
              <div class="event-access-view" id="eventAccessView" hidden>
                <div class="event-access-wifi" id="wifiGroup" hidden>
                  <span class="material-symbols-outlined event-access-mark" id="wifiIcon" hidden>wifi</span>
                  <div id="wifiNetwork" class="event-access-pair" hidden>
                    <span class="event-access-k">Network:</span>
                    <span class="event-access-v"></span>
                  </div>
                  <div id="wifiPassword" class="event-access-pair" hidden>
                    <span class="event-access-k">Password:</span>
                    <span class="event-access-v"></span>
                  </div>
                </div>
                <div class="event-access-gallery" id="galleryGroup" hidden>
                  <span class="material-symbols-outlined event-access-mark" id="galleryIcon">photo_library</span>
                  <a id="liveGallery" class="event-access-button" hidden target="_blank" rel="noopener noreferrer">Live Gallery</a>
                  <div id="loveGalleryPasscode" class="event-access-pair" hidden>
                    <span class="event-access-k">Passcode:</span>
                    <span class="event-access-v"></span>
                  </div>
                </div>
              </div>
              <div class="event-access-edit" id="eventAccessEdit" hidden>
                <label class="event-access-field">
                  <span class="event-access-label">Network</span>
                  <input id="wifiNetworkInput" type="text" name="event-wifi-network" placeholder="Network name" autocomplete="off">
                </label>
                <label class="event-access-field">
                  <span class="event-access-label">Password</span>
                  <input id="wifiPasswordInput" type="text" name="event-wifi-password" placeholder="Optional" autocomplete="new-password">
                </label>
                <label class="event-access-field">
                  <span class="event-access-label">Live gallery link</span>
                  <input id="liveGalleryInput" type="url" placeholder="https://" autocomplete="off">
                </label>
                <label class="event-access-field">
                  <span class="event-access-label">Passcode</span>
                  <input id="loveGalleryPasscodeInput" type="text" placeholder="Optional" autocomplete="off">
                </label>
              </div>
            </div>
          </div>
        </div>

        <div class="general-stats-grid">
          <div class="info-row info-row--place">
            <div class="info-card info-card--place">
              <div class="place-header">
                <div class="info-card-label">
                  <span class="info-card-label-text">
                    <span class="material-symbols-outlined">cloud</span>
                    Weather
                  </span>
                </div>
                <div class="place-location">
                  <span class="material-symbols-outlined">place</span>
                  <div id="location" class="read-only info-card-value"></div>
                </div>
              </div>
              <div class="place-weather">
                <div class="weather-forecast" id="weatherForecast">
                  <div class="weather-placeholder">
                    <span class="material-symbols-outlined">cloud</span>
                    <span>Loading weather...</span>
                  </div>
                </div>
                <div id="weather" class="read-only weather-notes info-card-value"></div>
              </div>
            </div>
          </div>

          <div class="info-row info-row--dates">
            <div class="info-card">
              <label for="start" class="info-card-label">
                <span class="material-symbols-outlined">calendar_month</span>
                Start Date
              </label>
              <div id="startDisplay" class="read-only info-card-value date-display"></div>
              <input type="date" id="start" name="start" hidden>
            </div>
            <div class="info-card">
              <label for="end" class="info-card-label">
                <span class="material-symbols-outlined">calendar_month</span>
                End Date
              </label>
              <div id="endDisplay" class="read-only info-card-value date-display"></div>
              <input type="date" id="end" name="end" hidden>
            </div>
          </div>

          <div class="info-row">
            <div class="info-card">
              <label for="attendees" class="info-card-label">
                <span class="material-symbols-outlined">groups</span>
                Attendee Count
              </label>
              <div id="attendees" class="read-only info-card-value"></div>
            </div>
            <div class="info-card">
              <label for="projectManager" class="info-card-label">
                <span class="material-symbols-outlined">person</span>
                Project Manager
              </label>
              <select id="projectManager" class="project-manager-select" hidden>
                <option value="">Not assigned</option>
              </select>
              <button type="button" id="projectManagerView" class="project-manager-view" hidden>Not assigned</button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="general-section" aria-label="Point of contacts">
      <div class="general-section-header">
        <h2 class="general-section-title">
          <span class="material-symbols-outlined">contacts</span>
          Point of Contacts
        </h2>
      </div>
      <div class="contacts-container general-table-card">
        <div class="contacts-scroll-wrapper">
          <table>
            <thead>
              <tr>
                <th>Name</th>
                <th>Phone</th>
                <th>Email</th>
                <th>Role</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="contactRows"></tbody>
          </table>
        </div>
        <button type="button" class="add-row-btn general-btn-secondary" onclick="addContactRow()">
          <span class="material-symbols-outlined">add</span>
          Add Row
        </button>
      </div>
    </section>

    <section class="general-section" aria-label="Locations">
      <div class="general-section-header">
        <h2 class="general-section-title">
          <span class="material-symbols-outlined">business</span>
          Locations
        </h2>
      </div>
      <div class="contacts-container general-table-card">
        <div class="contacts-scroll-wrapper">
          <table>
            <thead>
              <tr>
                <th>Name</th>
                <th>Address</th>
                <th>Event</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="locationsRows"></tbody>
          </table>
        </div>
        <button type="button" class="add-row-btn general-btn-secondary" onclick="addLocationRow()">
          <span class="material-symbols-outlined">add</span>
          Add Row
        </button>
      </div>
    </section>

    <div class="save-button-container">
      <button type="button" class="add-row-btn general-btn-primary" onclick="saveGeneralInfo()">Save Changes</button>
      <button id="editBtn" type="button" class="add-row-btn general-btn-outline" onclick="switchToEdit()">Edit</button>
    </div>
  </form>
</div>

<div id="projectManagerModal" class="pm-modal" hidden>
  <div class="pm-modal-card" role="dialog" aria-labelledby="pmContactTitle">
    <div class="pm-modal-header">
      <h3 id="pmContactTitle">Project Manager</h3>
      <button type="button" class="pm-modal-close" id="closeProjectManagerModal" aria-label="Close">&times;</button>
    </div>
    <p class="pm-contact-name" id="pmContactName"></p>
    <p class="pm-contact-line" id="pmContactPhoneRow">
      <span class="material-symbols-outlined" aria-hidden="true">call</span>
      <a id="pmContactPhone" href="#"></a>
    </p>
    <p class="pm-contact-line" id="pmContactEmailRow">
      <span class="material-symbols-outlined" aria-hidden="true">mail</span>
      <a id="pmContactEmail" href="#"></a>
    </p>
  </div>
</div>
