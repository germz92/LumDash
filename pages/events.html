<!-- Google Fonts Roboto -->
<link href="https://fonts.googleapis.com/css?family=Roboto:400,500,700&display=swap" rel="stylesheet">
<!-- Add Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

  <div class="logo-wrapper">
    <img src="assets/logo.png" alt="Logo" class="auth-logo">
  </div>
  <div class="card-container">
    <div class="top-bar">
      <h2 id="usernameDisplay">Welcome</h2>
      <div class="top-bar-icons">
        <button class="icon-btn" id="timesheetBtn" title="Timesheet" type="button">
          <span class="material-symbols-outlined">schedule</span>
        </button>
        <button class="icon-btn logout-btn" id="logoutBtn" title="Logout" type="button">
          <span class="material-symbols-outlined">logout</span>
        </button>
      </div>
    </div>

    <div class="events-header">
      <div class="events-search-row">
        <input id="searchEventsInput" type="search" placeholder="Search" autocomplete="off">
        <button class="btn-create events-icon-btn" type="button" title="Create event" aria-label="Create event">
          <span class="material-symbols-outlined">add</span>
        </button>
        <button id="calendarViewBtn" class="events-icon-btn" type="button" title="Calendar view" aria-label="Calendar view">
          <span class="material-symbols-outlined">calendar_month</span>
        </button>
        <div class="sort-menu-wrap">
          <button id="sortMenuBtn" class="events-icon-btn" type="button" title="Sort" aria-label="Sort" aria-expanded="false">
            <span class="material-symbols-outlined">sort</span>
          </button>
          <div id="sortMenu" class="sort-menu" hidden>
            <button type="button" data-sort="oldest">Soonest first</button>
            <button type="button" data-sort="newest">Latest first</button>
            <button type="button" data-sort="title">Title A–Z</button>
          </div>
          <select id="sortDropdown" hidden>
            <option value="oldest" selected>Soonest First</option>
            <option value="newest">Latest First</option>
            <option value="title">Title A–Z</option>
          </select>
        </div>
      </div>
      <div class="event-chips">
        <button type="button" class="event-chip active" data-filter="upcoming">Upcoming</button>
        <button type="button" class="event-chip" data-filter="past">Past</button>
        <button type="button" class="event-chip" data-filter="all">All</button>
        <button type="button" id="toggleArchivedBtn" class="event-chip">Archived</button>
      </div>
    </div>

    <div class="events-scroll">
      <div id="tableList" class="table-cards"></div>
      <div id="calendarViewContainer" style="display: none;"></div>
    </div>
  </div>

<!-- Share Modal -->
<div id="shareModal" class="modal">
  <div class="modal-content">
    <h3>Share Event</h3>

    <!-- Owners List -->
    <div id="ownerList" style="margin-bottom: 10px;">
      <strong>Owners:</strong>
      <ul style="margin: 5px 0; padding-left: 20px;"></ul>
    </div>

    <!-- Leads List -->
    <div id="leadList" style="margin-bottom: 10px;">
      <strong>Leads:</strong>
      <ul style="margin: 5px 0; padding-left: 20px;"></ul>
    </div>

    <!-- Shared With List -->
    <div id="sharedList" style="margin-bottom: 10px;">
      <strong>Shared With:</strong>
      <ul style="margin: 5px 0; padding-left: 20px;"></ul>
    </div>

    <!-- User Input with Autofill -->
    <div id="userAutofillContainer" style="position: relative; margin-bottom: 10px;">
      <input id="shareEmail" placeholder="Type name or email to search users..." autocomplete="off">
      <div id="userSuggestions" style="position: absolute; top: 100%; left: 0; right: 0; background: white; border: 1px solid #ccc; border-top: none; border-radius: 0 0 4px 4px; max-height: 200px; overflow-y: auto; z-index: 1000; display: none; box-shadow: 0 2px 8px rgba(0,0,0,0.1);"></div>
    </div>
    
    <!-- Selected Users Display -->
    <div id="selectedUsersContainer" style="margin-bottom: 10px;">
      <div id="selectedUsersList" style="display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px;"></div>
    </div>

    <button onclick="submitShare()">Share</button>
    <button onclick="closeModal()">Close</button>
  </div>
</div>

  <!-- Create Modal -->
  <div id="createModal" class="modal">
    <div class="modal-content">
      <h3>Create New Event</h3>
      <input id="newTitle" placeholder="Event Name">
      <input id="newClient" placeholder="Client Name">
      <input id="newStart" type="date">
      <input id="newEnd" type="date">
      <button onclick="submitCreate()">Create</button>
      <button onclick="hideCreateModal()">Close</button>
    </div>
  </div>
  <script>console.log('✅ events.html loaded');</script>
