<!-- Google Fonts Roboto -->
<link href="https://fonts.googleapis.com/css?family=Roboto:400,500,700&display=swap" rel="stylesheet">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="../css/users.css">

<div class="users-page">
  <button onclick="window.location.href = '../dashboard.html#events'" class="back-button btn-outlined">← Back to Events</button>
  <div class="card">
    <div class="users-toolbar">
      <h1>User Management</h1>
      <button type="button" id="inviteBtn" class="btn-primary">Invite</button>
    </div>
    <div id="messageArea"></div>
    <section class="invite-section" id="inviteSection">
      <h2>Pending invites</h2>
      <div class="table-responsive">
        <table class="user-table">
          <thead>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Role</th>
              <th>Expires</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="inviteTableBody">
            <tr class="user-table-status"><td colspan="5">Loading invites...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
    <h2 class="users-subtitle">Accounts</h2>
    <div class="table-responsive">
      <table class="user-table accounts-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Role</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="userTableBody">
          <tr class="user-table-status"><td colspan="5">Loading users...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
<!-- Edit/Reset Modal -->
<div id="userModal" class="modal">
  <div class="modal-content">
    <span class="close-btn" id="closeModalBtn">&times;</span>
    <h3 id="modalTitle">Edit User</h3>
    <form id="userForm">
      <input type="hidden" id="userId">
      <div class="form-group">
        <label for="userName">Name</label>
        <input type="text" id="userName" required>
      </div>
      <div class="form-group">
        <label for="userEmail">Email</label>
        <input type="email" id="userEmail" required>
      </div>
      <div class="form-group">
        <label for="userPhone">Phone</label>
        <input type="tel" id="userPhone" autocomplete="tel">
      </div>
      <div class="form-group">
        <label for="userRole">Role</label>
        <select id="userRole">
          <option value="user">User</option>
          <option value="admin">Admin</option>
        </select>
      </div>
      <div class="form-group" id="passwordGroup" style="display:none;">
        <label for="userPassword">New Password</label>
        <input type="password" id="userPassword" minlength="6">
      </div>
      <div class="form-buttons">
        <button type="button" id="cancelModalBtn" class="btn-outlined">Cancel</button>
        <button type="submit" id="saveUserBtn" class="btn-edit">Save</button>
      </div>
    </form>
    <button id="resetPasswordBtn" class="btn-reset btn-outlined" style="margin-top: 10px;">Reset Password</button>
  </div>
</div>
<div id="inviteModal" class="modal">
  <div class="modal-content">
    <span class="close-btn" id="closeInviteModalBtn">&times;</span>
    <h3>Invite someone</h3>
    <form id="inviteForm">
      <div class="form-group">
        <label for="inviteName">Name</label>
        <input type="text" id="inviteName" required>
      </div>
      <div class="form-group">
        <label for="inviteEmail">Email</label>
        <input type="email" id="inviteEmail" required>
      </div>
      <div class="form-group">
        <label for="inviteRole">Role</label>
        <select id="inviteRole">
          <option value="user">User</option>
          <option value="admin">Admin</option>
        </select>
      </div>
      <div class="form-buttons">
        <button type="button" id="cancelInviteBtn" class="btn-outlined">Cancel</button>
        <button type="submit" id="sendInviteBtn" class="btn-edit">Send invite</button>
      </div>
    </form>
  </div>
</div>
<!-- Add config.js first to ensure API_BASE is available -->
<script src="../js/config.js"></script>
<script src="../js/users.js"></script>
